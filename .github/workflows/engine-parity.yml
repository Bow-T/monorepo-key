# Cổng khớp engine: engine Dart và Swift cùng chạy bộ ca gõ chuẩn dùng chung
# (packages/viet_engine/spec/typing_cases.tsv) cùng bộ test riêng của chúng. Engine
# C++ chạy cùng file đó trong windows-ime.yml. Sửa luật gõ mà sót một bản là đỏ.
name: engine-parity

on:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/viet_engine/**'
      - 'apps/macos_ime/Sources/VietEngine/**'
      - 'apps/macos_ime/Tests/VietEngineTests/**'
      - 'apps/macos_ime/Package.swift'
      - '.github/workflows/engine-parity.yml'
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/viet_engine/**'
      - 'apps/macos_ime/Sources/VietEngine/**'
      - 'apps/macos_ime/Tests/VietEngineTests/**'
      - 'apps/macos_ime/Package.swift'
      - '.github/workflows/engine-parity.yml'
  workflow_dispatch:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.1 # Dart đi kèm Flutter ghim trong .fvmrc
      - run: dart pub get
      - run: dart analyze packages/viet_engine
      - run: dart test packages/viet_engine

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test engine Swift
        # Chỉ target VietEngineTests: BowGoAppTests cần phiên đồ hoạ.
        working-directory: apps/macos_ime
        run: swift test --filter VietEngineTests
