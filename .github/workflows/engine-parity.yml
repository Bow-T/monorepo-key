# Cổng khớp engine: core Rust (packages/viet_core), engine Dart (spec + UI Flutter) và
# lớp bọc Swift của bộ gõ macOS cùng chạy bộ ca gõ chuẩn dùng chung
# (packages/viet_engine/spec/typing_cases.tsv) cùng bộ test riêng. Lớp bọc C++ chạy
# file đó trong windows-ime.yml. Sửa luật gõ mà sót một bản là đỏ.
name: engine-parity

on:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/viet_engine/**'
      - 'packages/viet_core/**'
      - 'apps/macos_ime/Sources/VietEngine/**'
      - 'apps/macos_ime/Sources/CVietCore/**'
      - 'apps/macos_ime/Tests/VietEngineTests/**'
      - 'apps/macos_ime/Package.swift'
      - 'apps/macos_ime/scripts/build-core.sh'
      - '.github/workflows/engine-parity.yml'
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/viet_engine/**'
      - 'packages/viet_core/**'
      - 'apps/macos_ime/Sources/VietEngine/**'
      - 'apps/macos_ime/Sources/CVietCore/**'
      - 'apps/macos_ime/Tests/VietEngineTests/**'
      - 'apps/macos_ime/Package.swift'
      - 'apps/macos_ime/scripts/build-core.sh'
      - '.github/workflows/engine-parity.yml'
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path packages/viet_core/Cargo.toml

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.1 # Dart đi kèm Flutter ghim trong .fvmrc
      - run: dart pub get
      - run: dart analyze packages/viet_engine
      - run: dart test packages/viet_engine

  swift:
    # `swift test` build cả target App: Swift của macos-15 báo lỗi concurrency VisionKit
    # mà Xcode 26 (toolchain team dùng) không báo.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build core Rust
        run: bash apps/macos_ime/scripts/build-core.sh
      - name: Test engine Swift
        # Chỉ target VietEngineTests: BowGoAppTests cần phiên đồ hoạ.
        working-directory: apps/macos_ime
        run: swift test --filter VietEngineTests
