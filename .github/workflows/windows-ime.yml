# Build bộ gõ Windows trên máy Windows thật của GitHub: engine + common + DLL TSF,
# rồi chạy 2 bộ test C++. Trên macOS chỉ build được engine/common, nên đây là nơi
# duy nhất `tsf/` được biên dịch.
name: windows-ime

on:
  push:
    branches: [main]
    paths: ['apps/windows_ime/**', '.github/workflows/windows-ime.yml']
  pull_request:
    paths: ['apps/windows_ime/**', '.github/workflows/windows-ime.yml']
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # Không ghim -G: để CMake chọn bản Visual Studio có trên image runner.
        run: cmake -S apps/windows_ime -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: BowGoTSF
          path: build/Release/BowGoTSF.dll
